<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karle Kehrwoch — Deployment Test</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #171d2b 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .meta-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .meta-row:last-child {
      border-bottom: none;
    }
    .meta-label {
      color: var(--text-muted);
    }
    .meta-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      color: #e5e7eb;
    }
    .btn {
      background: #10b981;
      color: #041f16;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:hover {
      background: #34d399;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      Static WebApp Online
    </div>
    <h1>Deployment Test</h1>
    <p>Diese Test-Website wurde automatisch durch Karle Kehrwoch über static-webapp-deploy auf Plesk bereitgestellt.</p>
    
    <div class="meta-box">
      <div class="meta-row">
        <span class="meta-label">App:</span>
        <span class="meta-val">static-test</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Host:</span>
        <span class="meta-val">webapps.vsh-studio.de</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Status:</span>
        <span class="meta-val" style="color: #34d399;">Aktiv</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Client Zeit:</span>
        <span class="meta-val" id="time">--:--:--</span>
      </div>
    </div>

    <button class="btn" onclick="handleClick()">Klick-Test (<span id="clicks">0</span>)</button>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('de-DE');
    }
    setInterval(updateTime, 1000);
    updateTime();

    let count = 0;
    function handleClick() {
      count++;
      document.getElementById('clicks').textContent = count;
    }
  </script>
</body>
</html>
